<div class="admin-page">
  <div class="admin-topo">
    <h2>Painel administrativo</h2>
    <div class="admin-usuario">
      @if (usuario(); as logado) {
        <span class="nome-usuario">{{ logado.name }} · {{ logado.profile.name }}</span>
      }
      <!-- O admin legado não tinha como encerrar a sessão. -->
      <button type="button" class="btn-sair" (click)="sair()">Sair</button>
    </div>
  </div>

  <nav class="tab-header">
    @for (aba of abas(); track aba.rota) {
      <a class="tab-btn" [routerLink]="aba.rota" routerLinkActive="active">{{ aba.rotulo }}</a>
    }
  </nav>

  <router-outlet />
</div>
